  <script>
    // Storage polyfill using localStorage (works in browser)
    window.storage = {
      get: async (key) => {
        try {
          const val = localStorage.getItem('almo_project_' + key);
          return val ? {key, value: val} : null;
        } catch(e) { return null; }
      },
      set: async (key, value) => {
        try {
          localStorage.setItem('almo_project_' + key, value);
          return {key, value};
        } catch(e) { return null; }
      },
      delete: async (key) => {
        try {
          localStorage.removeItem('almo_project_' + key);
          return {key, deleted: true};
        } catch(e) { return null; }
      },
      list: async (prefix) => {
        try {
          const keys = Object.keys(localStorage)
            .filter(k => k.startsWith('almo_project_' + (prefix||'')))
            .map(k => k.replace('almo_project_', ''));
          return {keys};
        } catch(e) { return {keys:[]}; }
      }
    };
  </script>

// ── API Claude helper ──────────────────────────────────────────
const callClaude = async (messages, maxTokens=1000) => {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:maxTokens,messages,
      mcp_servers:[{type:"url",url:"https://drivemcp.googleapis.com/mcp/v1",name:"gdrive"}]})
  });
  return r.json();
};

// ── Drive helpers ──────────────────────────────────────────────
const driveCall = async (prompt) => {
  const data = await callClaude([{role:"user",content:prompt}], 2000);
  return data;
};

const createDriveFolder = async (name, parentId) => {
  const data = await callClaude([{role:"user",content:
    `Crée un dossier Google Drive nommé exactement "${name}" dans le dossier parent ID="${parentId}". Réponds UNIQUEMENT avec le JSON: {"folderId":"...", "folderUrl":"..."}`
  }], 500);
  const text = data.content?.find(b=>b.type==="text")?.text||"";
  try { return JSON.parse(text.replace(/```json|```/g,"").trim()); } catch { return null; }
};

const uploadToDrive = async (fileName, base64Content, mimeType, parentId) => {
  const data = await callClaude([{role:"user",content:
    `Upload ce fichier sur Google Drive:
- Nom: "${fileName}"
- Dossier parent ID: "${parentId}"  
- Type MIME: "${mimeType}"
- Contenu base64: ${base64Content.slice(0,100)}... (fichier complet fourni)
Réponds UNIQUEMENT avec JSON: {"fileId":"...","fileUrl":"...","fileName":"${fileName}"}`
  }], 500);
  const text = data.content?.find(b=>b.type==="text")?.text||"";
  try { return JSON.parse(text.replace(/```json|```/g,"").trim()); } catch { return null; }
};

// ── Créer structure Drive projet ───────────────────────────────
const initDriveProjet = async (projet, onUpdate) => {
  try {
    // Dossier principal projet
    const nomDossier = `ALMO PROJECT — ${projet.client||"CLIENT"} — ${projet.nom}`.slice(0,60);
    const projFolder = await createDriveFolder(nomDossier, DRIVE_ROOT_ID);
    if (!projFolder?.folderId) throw new Error("Échec création dossier projet");

    // Sous-dossiers
    const subs = await Promise.all([
      createDriveFolder("📄 Actes d'engagement", projFolder.folderId),
      createDriveFolder("💳 Propositions de paiement", projFolder.folderId),
      createDriveFolder("📊 RECAP financier", projFolder.folderId),
      createDriveFolder("📥 Devis entreprises", projFolder.folderId),
      createDriveFolder("📤 Dépôts client", projFolder.folderId),
      createDriveFolder("🧾 Factures", projFolder.folderId),
    ]);

    const [actesF, paiementF, recapF, devisF, clientF, facturesF] = subs;

    const driveData = {
      driveFolderId: projFolder.folderId,
      driveFolderUrl: `https://drive.google.com/drive/folders/${projFolder.folderId}`,
      driveSubFolders: {
        actes: actesF?.folderId,
        paiements: paiementF?.folderId,
        recap: recapF?.folderId,
        devis: devisF?.folderId,
        client: clientF?.folderId,
        factures: facturesF?.folderId,
      }
    };
    onUpdate({...projet, ...driveData});
    return driveData;
  } catch(e) {
    console.error("Drive init error:", e);
    return null;
  }
};

        {stats.map(s=>(
          <Card key={s.label} style={{borderTop:`3px solid ${s.color}`,padding:"16px 18px"}}>

// ── Import Devis PDF ───────────────────────────────────────────
const ImportDevis = ({onImport,projets}) => {
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");
  const [projetCible,setProjetCible]=useState(projets[0]?.id||"nouveau");
  const fileRef=useRef();

  const analyser = async(file) => {
    setLoading(true);setError("");setResult(null);
    try {
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json","x-api-key":window.getApiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1000,
          messages:[{role:"user",content:[
            {type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}},
            {type:"text",text:`Ce document est un devis ou budget signé avec un client maître d\'ouvrage. Extrait toutes les informations lot par lot. Réponds UNIQUEMENT en JSON valide sans backticks ni texte autour:\n{\n  \"client\":\"Nom complet du client\",\n  \"adresseClient\":\"Adresse complète\",\n  \"chantier\":\"Nom ou adresse du chantier\",\n  \"numeroDevis\":\"numero\",\n  \"dateDevis\":\"YYYY-MM-DD\",\n  \"lots\":[{\"nom\":\"LOT EN MAJUSCULES\",\"budgetHT\":0,\"tva\":0.1,\"budgetTTC\":0}],\n  \"totalHT\":0,\n  \"totalTTC\":0\n}\nSi pas de décomposition par lot, crée un lot unique avec le type de travaux en majuscules. TVA: 0.055=5.5pct, 0.1=10pct, 0.2=20pct.`
          ]}]})
      });
      const data=await resp.json();
      const text=data.content?.find(b=>b.type==="text")?.text||"";
      const clean=text.replace(/```json|```/g,"").trim();
      setResult(JSON.parse(clean));
    } catch(e){setError("Erreur: "+e.message);}
    setLoading(false);
  };

  const confirmer = () => {
    if(!result) return;
    // Build lots from result.lots[] or fallback to single lot
    const lotsData = result.lots && result.lots.length > 0 ? result.lots : [{
      nom: result.lot || "TRAVAUX", budgetHT: result.montantHT || 0,
      tva: result.tva || 0.1, budgetTTC: result.montantTTC || 0
    }];
    const lots = lotsData.map(l => ({
      id: uid(),
      nom: l.nom || "TRAVAUX",
      tva: String(l.tva || 0.1),
      marcheHT: "",           // marché entreprise = vide, à remplir via acte d\'engagement
      budgetHT: l.budgetHT,   // budget client signé
      budgetTTC: l.budgetTTC,
      budgetTva: l.tva,
      entreprise: "",
      factures: [], avenants: []
    }));
    if(projetCible==="nouveau"){
      const projet={
        id:uid(),
        nom:result.chantier||result.client||"Nouveau projet",
        client:result.client||"",
        adresseClient:result.adresseClient||"",
        ville:"",
        adresseChantier:result.chantier||result.adresseClient||"",
        statut:"en_cours",
        createdAt:today(),
        lots,
        budgetTotal:{totalHT:result.totalHT,totalTTC:result.totalTTC}
      };
      onImport(projet,null,result);
    } else {
      onImport(null,{projetId:projetCible,lots},result);
    }
    setResult(null);
  };

  return (
    <Card style={{border:`2px dashed ${C.rouge}44`,background:"#fff9f9",marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
        <span style={{fontSize:22}}>📎</span>
        <div>
          <div style={{fontWeight:700,color:C.gris,fontSize:13}}>Importer un devis signé</div>
          <div style={{fontSize:11,color:"#999"}}>PDF → extraction automatique + sauvegarde Drive</div>
        </div>
      </div>
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <input ref={fileRef} type="file" accept=".pdf" onChange={e=>{if(e.target.files[0])analyser(e.target.files[0]);}} style={{display:"none"}}/>
        <Btn onClick={()=>fileRef.current.click()} disabled={loading}>
          {loading?"⏳ Analyse...":"📄 Choisir un devis PDF"}
        </Btn>
        {projets.length>0&&(
          <select value={projetCible} onChange={e=>setProjetCible(e.target.value)}
            style={{border:`1.5px solid ${C.grisbord}`,borderRadius:6,padding:"8px 12px",fontSize:13,fontFamily:"inherit"}}>
            <option value="nouveau">➕ Nouveau projet</option>
            {projets.map(p=><option key={p.id} value={p.id}>{p.nom}</option>)}
          </select>
        )}
      </div>
      {error&&<div style={{marginTop:10,color:C.rouge,fontSize:12,padding:"8px 12px",background:"#fee",borderRadius:6}}>{error}</div>}
      {result&&(
        <div style={{marginTop:14,padding:14,background:C.grisClair,borderRadius:8}}>
          <div style={{fontWeight:700,color:C.vert,marginBottom:10}}result.client||result.chantier} — {result.lots?.length||1} lot(s) · {fmt(result.totalHT||result.montantHT)} HT</div>
          {result.lots&&result.lots.length>0&&(
            <div style={{overflowX:"auto",marginBottom:10}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                <thead><tr style={{background:C.gris,color:"#fff"}}>
                  {["Lot","Budget HT","TVA","Budget TTC"].map(h=>(
                    <th key={h} style={{padding:"5px 8px",textAlign:h==="Lot"?"left":"right",fontWeight:700}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>{result.lots.map((l,i)=>(
                  <tr key={i} style={{background:i%2===0?"#fff":C.grisClair,borderBottom:`1px solid ${C.grisbord}`}}>
                    <td style={{padding:"5px 8px",fontWeight:600}}>{l.nom}</td>
                    <td style={{padding:"5px 8px",textAlign:"right"}}>{fmt(l.budgetHT)}</td>
                    <td style={{padding:"5px 8px",textAlign:"right"}}>{(Number(l.tva)*100).toFixed(0)}%</td>
                    <td style={{padding:"5px 8px",textAlign:"right",fontWeight:700,color:C.violet}}>{fmt(l.budgetTTC)}</td>
                  </tr>
                ))}</tbody>
                <tfoot><tr style={{background:C.gris,color:"#fff",fontWeight:700}}>
                  <td style={{padding:"5px 8px"}}>TOTAL</td>
                  <td style={{padding:"5px 8px",textAlign:"right"}}>{fmt(result.totalHT)}</td>
                  <td></td>
                  <td style={{padding:"5px 8px",textAlign:"right"}}>{fmt(result.totalTTC)}</td>
                </tr></tfoot>
              </table>
            </div>
          )}
          <div style={{fontSize:11,color:"#555",marginBottom:10,padding:"6px 10px",background:"#EEF2FF",borderRadius:5,border:"1px solid #C3B1E1"}}>
            💡 Ces montants alimenteront la colonne <strong>BUDGET CLIENT</strong> de votre récap financier.
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn small onClick={confirmer}>✓ Créer le projet avec ces budgets</Btn>
            <Btn small outline color={C.gris} onClick={()=>setResult(null)}>Annuler</Btn>
          </div>
        </div>
      )}
    </Card>
  );
};

// ── Import Budget Client ────────────────────────────────────────
const ImportBudget = ({projet,onUpdate}) => {
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");
  const fileRef=useRef();

  const analyser = async(file) => {
    setLoading(true);setError("");setResult(null);
    try {
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json","x-api-key":window.getApiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:2000,
          messages:[{role:"user",content:[
            {type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}},
            {type:"text",text:`Budget de travaux signé avec client, lot par lot. Réponds UNIQUEMENT en JSON:
{"nomProjet":"...","client":"...","lots":[{"nom":"LOT MAJUSCULES","budgetHT":0,"tva":0.1,"budgetTTC":0}],"totalHT":0,"totalTTC":0}`}
          ]}]})
      });
      const data=await resp.json();
      const text=data.content?.find(b=>b.type==="text")?.text||"";
      const clean=text.replace(/```json|```/g,"").trim();
      setResult(JSON.parse(clean));
    } catch(e){setError("Erreur: "+e.message);}
    setLoading(false);
  };

  const appliquer = () => {
    if(!result||!projet) return;
    const lotsMAJ=projet.lots.map(lot=>{
      const nomN=normalize(lot.nom);
      const match=result.lots.find(bl=>{const blN=normalize(bl.nom);return blN.includes(nomN)||nomN.includes(blN)||blN.split(/[\/ ]/)[0]===nomN.split(/[\/ ]/)[0];});
      return match?{...lot,budgetHT:match.budgetHT,budgetTTC:match.budgetTTC,budgetTva:match.tva}:lot;
    });
    const lotsNouveaux=result.lots.filter(bl=>{
      const blN=normalize(bl.nom);
      return !projet.lots.some(l=>{const lN=normalize(l.nom);return blN.includes(lN)||lN.includes(blN);});
    }).map(bl=>({id:uid(),nom:bl.nom,tva:String(bl.tva),marcheHT:"",budgetHT:bl.budgetHT,budgetTTC:bl.budgetTTC,budgetTva:bl.tva,entreprise:"",factures:[],avenants:[]}));
    onUpdate({...projet,lots:[...lotsMAJ,...lotsNouveaux],budgetTotal:result});
    setResult(null);
    alert("✅ Budget intégré !");
  };

  if(!projet) return null;
  return (
    <Card style={{border:`2px dashed ${C.bleu}44`,background:"#f5f8ff",marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
        <span style={{fontSize:22}}>📋</span>
        <div>
          <div style={{fontWeight:700,color:C.gris,fontSize:13}}>Importer le budget client signé</div>
          <div style={{fontSize:11,color:"#999"}}>PDF budget MOA → colonne BUDGET du RECAP + Drive</div>
        </div>
      </div>
      <input ref={fileRef} type="file" accept=".pdf" onChange={e=>{if(e.target.files[0])analyser(e.target.files[0]);}} style={{display:"none"}}/>
      <Btn small color={C.bleu} onClick={()=>fileRef.current.click()} disabled={loading}>
        {loading?"⏳ Analyse...":"📄 Importer budget PDF"}
      </Btn>
      {error&&<div style={{marginTop:10,color:C.rouge,fontSize:12,padding:"8px 12px",background:"#fee",borderRadius:6}}>{error}</div>}
      {result&&(
        <div style={{marginTop:12,padding:12,background:"#fff",borderRadius:8,border:`1px solid ${C.bleu}33`}}>
          <div style={{fontWeight:700,color:C.vert,marginBottom:8,fontSize:13}}>✅ {result.lots?.length} lot(s) · {fmt(result.totalHT)} HT</div>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,marginBottom:10}}>
            <thead><tr style={{background:C.bleu}}>
              {["Lot","Budget HT","TVA","Budget TTC"].map(h=><th key={h} style={{padding:"4px 8px",color:"#fff",textAlign:h==="Lot"?"left":"right",fontWeight:700}}>{h}</th>)}
            </tr></thead>
            <tbody>{result.lots?.map((l,i)=>(
              <tr key={i} style={{background:i%2===0?"#fff":C.grisClair}}>
                <td style={{padding:"4px 8px",fontWeight:600}}>{l.nom}</td>
                <td style={{padding:"4px 8px",textAlign:"right"}}>{fmt(l.budgetHT)}</td>
                <td style={{padding:"4px 8px",textAlign:"right"}}>{(Number(l.tva)*100).toFixed(0)}%</td>
                <td style={{padding:"4px 8px",textAlign:"right",fontWeight:700}}>{fmt(l.budgetTTC)}</td>
              </tr>
            ))}</tbody>
          </table>
          <div style={{display:"flex",gap:8}}>
            <Btn small onClick={appliquer}>✓ Intégrer au projet</Btn>
            <Btn small outline color={C.gris} onClick={()=>setResult(null)}>Annuler</Btn>
          </div>
        </div>
      )}
    </Card>
  );
};

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:18}}>☁️</span>

          Ouvrir le dossier →

// ── Code accès client ───────────────────────────────────────────
const genCodeClient = (projetId) => {
  const hash = projetId.split("").reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0)|0,0);
  return Math.abs(hash).toString(36).toUpperCase().slice(0,6);
};

  const [code,setCode]=useState("");

  const [uploadingDevis,setUploadingDevis]=useState(false);
  const fileRef=useRef();

  const acceder = () => {
    const p=projets.find(p=>genCodeClient(p.id)===code.toUpperCase().trim());
    if(p){setProjetClient(p);setErrCode("");}
    else setErrCode("Code invalide — vérifiez le code fourni par ALMO");
  };

  const deposerDevis = async(file) => {
    setUploadingDevis(true);
    // Lire le fichier
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
    // Enregistrer dans le projet (métadonnée)
    const depotId=uid();
    const depot={id:depotId,nom:file.name,date:today(),type:"devis_client",b64Header:b64.slice(0,50)};
    const updated={...projetClient,depotsClient:[...(projetClient.depotsClient||[]),depot]};
    onUpdateProjet(updated);

    // Upload Drive si disponible
    if(projetClient.driveSubFolders?.client){
      try {
        await callClaude([{role:"user",content:
          `Upload ce fichier PDF sur Google Drive dans le dossier ID="${projetClient.driveSubFolders.client}":
Nom: "${file.name}"
Type: application/pdf
Base64: ${b64}
Confirme l'upload avec un simple JSON {"done":true}`}],500);

                      <td style={{padding:"8px 10px",textAlign:"right",color:C.violet}}>{bTTC?fmt(bTTC):<span style={{color:"#ccc"}}>—</span>}</td>
                      <td style={{padding:"8px 10px",textAlign:"right",fontWeight:600}}>{fmt(mHT)}</td>

                    <td style={{padding:"9px 10px",textAlign:"right"}}>{fmt(totalPayeTTC)}</td>
                    <td style={{padding:"9px 10px",textAlign:"right"}}>{fmt(totalFactureTTC-totalPayeTTC)}</td>

      )}

      {onglet==="lots"&&(
        <div style={{display:"grid",gap:12}}>
          {projet.lots.length===0&&<Card style={{textAlign:"center",color:"#bbb",padding:28}}>Aucun lot.</Card>}

            const isOpen=lotOuvert===lot.id;

const PageProjets = ({projets,onUpdateProjet,onDeleteProjet,setPage,setContexte}) => {
  const [vue,setVue]=useState("liste");
  const [projetActifId,setProjetActifId]=useState(null);
  const projetActif=projets.find(p=>p.id===projetActifId);

  const handleImport=(nouveauProjet,lotsAAjouter,devisData)=>{
    if(nouveauProjet){
      onUpdateProjet(nouveauProjet);
      setProjetActifId(nouveauProjet.id);
      setVue("detail");
      // Pre-fill acte with first lot if only one
      const premierLot = nouveauProjet.lots?.[0];
      setContexte({projet:nouveauProjet, devis:{...devisData, lot:premierLot?.nom, montantHT:premierLot?.budgetHT, tva:String(premierLot?.budgetTva||0.1)}});
      setPage("projets");
    } else if(lotsAAjouter){
      const p=projets.find(x=>x.id===lotsAAjouter.projetId);
      if(p){
        const lots = lotsAAjouter.lots || [lotsAAjouter.lot];
        const updated={...p,lots:[...p.lots,...lots]};
        onUpdateProjet(updated);
        setContexte({projet:updated,devis:devisData});
        setPage("projets");
      }
    }
  };

  if(projetActif&&vue==="detail") return (
    <div style={{padding:32}}>
      <button onClick={()=>{setVue("liste");setProjetActifId(null);}}
        style={{background:"none",border:"none",cursor:"pointer",color:C.rouge,fontWeight:700,fontSize:13,marginBottom:16,fontFamily:"inherit"}}>← Retour à la liste</button>
      <ProjetDetail projet={projetActif} onUpdate={onUpdateProjet} onDelete={id=>{onDeleteProjet(id);setVue("liste");setProjetActifId(null);}} setPage={setPage} setContexte={setContexte}/>
    </div>
  );

  return (
    <div style={{padding:32}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h1 style={{margin:0,fontSize:20,fontWeight:800,color:C.gris}}>Mes projets</h1>
        <Btn outline color={C.gris} onClick={()=>setVue(vue==="nouveau"?"liste":"nouveau")}>{vue==="nouveau"?"Annuler":"+ Nouveau projet"}</Btn>
      </div>
      <ImportDevis onImport={handleImport} projets={projets}/>
      {vue==="nouveau"&&(
        <Card style={{marginBottom:20}}>
          <h3 style={{margin:"0 0 16px",fontSize:15,fontWeight:700}}>Nouveau projet</h3>
          <NouveauProjetForm onSave={p=>{onUpdateProjet(p);setVue("liste");}} onCancel={()=>setVue("liste")}/>
        </Card>
      )}
      {projets.length===0&&vue!=="nouveau"&&<Card style={{textAlign:"center",color:"#bbb",padding:40}}>Aucun projet. Importez un devis ou créez manuellement.</Card>}
      <div style={{display:"grid",gap:10}}>
        {projets.map(p=>{
          const totalHT=p.lots.reduce((s,l)=>s+(Number(l.marcheHT)||0),0);
          return (
            <Card key={p.id} style={{cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}} onClick={()=>{setProjetActifId(p.id);setVue("detail");}}>
              <div>
                <div style={{fontWeight:700,color:C.gris}}>{p.nom}</div>
                <div style={{fontSize:12,color:"#999",marginTop:2}}>{p.client} · {p.lots.length} lot(s) · {p.createdAt}</div>
              </div>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <DriveStatus projet={p}/>
                <span style={{fontSize:12,fontWeight:800,letterSpacing:1.5,color:C.rouge,background:C.rouge+"15",borderRadius:5,padding:"2px 8px"}}>{genCodeClient(p.id)}</span>
                <Badge label={p.statut==="en_cours"?"En cours":p.statut==="termine"?"Terminé":"En attente"} color={p.statut==="en_cours"?C.vert:p.statut==="termine"?C.bleu:C.orange}/>
                <span style={{fontWeight:700}}>{fmt(totalHT)} HT</span>
                <span style={{color:"#ccc"}}>›</span>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
};

const PagePaiement = ({contexte,projets}) => {
  const projet=contexte?.projet||projets[0],lot=contexte?.lot;
  const tvaInit=lot?.tva||"0.1",mHT=Number(lot?.marcheHT)||0;
  const [form,setForm]=useState({projetId:projet?.id||"",lotId:lot?.id||"",situationN:"01",dateTravauxAu:"",echeancePaiement:"",
    marcheHT_20:tvaInit==="0.2"?mHT:0,marcheHT_10:tvaInit==="0.1"?mHT:0,marcheHT_55:tvaInit==="0.055"?mHT:0,
    avenant1HT_20:0,avenant1HT_10:0,avenant1HT_55:0,avenant2HT_20:0,avenant2HT_10:0,avenant2HT_55:0,
    factCumul_20:0,factCumul_10:0,factCumul_55:0,factPrec_20:0,factPrec_10:0,factPrec_55:0,
    rg:0.05,penalites:0,paiementPrec:0,remarques:""});
  const set=k=>v=>setForm(f=>({...f,[k]:v}));
  const projetSel=projets.find(p=>p.id===form.projetId)||projet,lotSel=projetSel?.lots?.find(l=>l.id===form.lotId)||lot;
  const n=v=>Number(v)||0;
  const totHT_20=n(form.marcheHT_20)+n(form.avenant1HT_20)+n(form.avenant2HT_20);
  const totHT_10=n(form.marcheHT_10)+n(form.avenant1HT_10)+n(form.avenant2HT_10);
  const totHT_55=n(form.marcheHT_55)+n(form.avenant1HT_55)+n(form.avenant2HT_55);
  const totalTTC=totHT_20*1.2+totHT_10*1.1+totHT_55*1.055;
  const fC20=n(form.factCumul_20),fC10=n(form.factCumul_10),fC55=n(form.factCumul_55);
  const fP20=n(form.factPrec_20),fP10=n(form.factPrec_10),fP55=n(form.factPrec_55);
  const totTTCCumul=fC20*1.2+fC10*1.1+fC55*1.055,totTTCPrec=fP20*1.2+fP10*1.1+fP55*1.055,totTTCMois=totTTCCumul-totTTCPrec;
  const resteAFact=totalTTC-totTTCCumul,rgRate=n(form.rg);
  const rgCumul=totTTCCumul*rgRate,rgPrec=totTTCPrec*rgRate,rgMois=rgCumul-rgPrec;
  const pen=n(form.penalites),paiPrec=n(form.paiementPrec);

            </div>
          </Section>
          <Section title="Marché HT (M / Avt1 / Avt2)">
            {[["20%","20"],["10%","10"],["5,5%","55"]].map(([label,k])=>(
              <div key={k} style={{display:"grid",gridTemplateColumns:"45px 1fr 1fr 1fr",gap:4,marginBottom:5,alignItems:"center"}}>
                <span style={{fontSize:10,fontWeight:700,color:"#888"}}>{label}</span>
                {["marcheHT","avenant1HT","avenant2HT"].map(prefix=>(
                  <input key={prefix} type="number" value={form[`${prefix}_${k}`]} onChange={e=>set(`${prefix}_${k}`)(e.target.value)}
                    style={{border:`1px solid ${C.grisbord}`,borderRadius:4,padding:"5px 7px",fontSize:11,fontFamily:"inherit"}}/>
                ))}
              </div>
            ))}
          </Section>
          <Section title="Facturations HT (cumulé / précédent)">
            {[["20%","20"],["10%","10"],["5,5%","55"]].map(([label,k])=>(
              <div key={k} style={{display:"grid",gridTemplateColumns:"45px 1fr 1fr",gap:4,marginBottom:5,alignItems:"center"}}>
                <span style={{fontSize:10,fontWeight:700,color:"#888"}}>{label}</span>
                <input type="number" value={form[`factCumul_${k}`]} onChange={e=>set(`factCumul_${k}`)(e.target.value)} placeholder="Cumulé"
                  style={{border:`1px solid ${C.grisbord}`,borderRadius:4,padding:"5px 7px",fontSize:11,fontFamily:"inherit"}}/>
                <input type="number" value={form[`factPrec_${k}`]} onChange={e=>set(`factPrec_${k}`)(e.target.value)} placeholder="Précédent"
                  style={{border:`1px solid ${C.grisbord}`,borderRadius:4,padding:"5px 7px",fontSize:11,fontFamily:"inherit"}}/>
              </div>
            ))}
          </Section>
          <Section title="Déductions & Paiements">
            <div style={{display:"grid",gap:8}}>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <label style={{fontSize:11,fontWeight:700,color:C.gris,whiteSpace:"nowrap"}}>RG (%)</label>
                <input type="number" value={form.rg*100} onChange={e=>set("rg")(e.target.value/100)} style={{border:`1px solid ${C.grisbord}`,borderRadius:4,padding:"5px 8px",fontSize:12,fontFamily:"inherit",width:70}}/>
              </div>
              <Input label="Pénalités TTC" value={form.penalites} onChange={set("penalites")} type="number"/>
              <Input label="Paiements précédents TTC" value={form.paiementPrec} onChange={set("paiementPrec")} type="number"/>
              <Input label="Remarques" value={form.remarques} onChange={set("remarques")}/>
            </div>
          </Section>
          <div style={{background:C.gris,borderRadius:8,padding:14,color:"#fff",fontSize:12,marginBottom:12}}>
            <div style={{fontWeight:700,marginBottom:6,fontSize:11,textTransform:"uppercase"}}>Résumé</div>
            {[["Facturé ce mois TTC",fmt(totTTCMois)],["RG ce mois",fmt(rgMois)],["Pénalités",fmt(pen)]].map(([k,v])=>(
              <div key={k} style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{opacity:0.75}}>{k}</span><span style={{fontWeight:700}}>{v}</span></div>
            ))}
            <div style={{borderTop:"1px solid #ffffff33",marginTop:8,paddingTop:8,display:"flex",justifyContent:"space-between"}}>
              <span style={{fontWeight:700}}>TOTAL À PAYER</span>
              <span style={{fontWeight:800,fontSize:15,color:"#FFD54F"}}>{fmt(totalAPayer)}</span>
            </div>
          </div>
          <Btn onClick={()=>window.print()}>🖨️ Imprimer / PDF</Btn>
        </Card>
        <div style={{background:"#fff",border:`1px solid ${C.grisbord}`,borderRadius:10,overflow:"hidden"}}>
          <div style={{background:C.grisClair,padding:"9px 16px",borderBottom:`1px solid ${C.grisbord}`,display:"flex",justifyContent:"space-between"}}>
            <span style={{fontWeight:700,fontSize:11,color:C.gris,textTransform:"uppercase"}}>Aperçu — Proposition N°{form.situationN}</span>
            <Btn small onClick={()=>window.print()}>Imprimer</Btn>
          </div>
          <div id="paiement-print" style={{padding:"28px 36px",fontFamily:"Arial,sans-serif",fontSize:10.5}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,marginBottom:16,paddingBottom:12,borderBottom:`2px solid ${C.gris}`}}>
              <div><img src={LOGO} alt="ALMO" style={{height:46,marginBottom:4}}/><div style={{fontSize:9.5}}><div style={{fontWeight:700}}>ALMO PROJECT</div><div>14 chemin de la bruyère · 74600 ANNECY</div><div>06 32 76 70 43</div></div></div>
              <div><div style={{fontSize:9,fontWeight:700,color:"#999",textTransform:"uppercase",marginBottom:3}}>Maître d'ouvrage</div><div style={{fontWeight:700}}>{projetSel?.client||"—"}</div><div style={{fontSize:9.5}}>{projetSel?.adresseClient}</div><div style={{fontSize:10,marginTop:4,fontWeight:700}}>{projetSel?.nom}</div></div>
              <div><div style={{fontSize:9,fontWeight:700,color:"#999",textTransform:"uppercase",marginBottom:3}}>Entreprise</div><div style={{fontWeight:700}}>{lotSel?.entreprise||"—"}</div></div>
            </div>
            <div style={{background:C.gris,color:"#fff",textAlign:"center",padding:"8px 0",borderRadius:4,marginBottom:12}}>
              <div style={{fontWeight:900,fontSize:13,letterSpacing:1}}>PROPOSITION DE PAIEMENT N°{form.situationN}</div>
              <div style={{fontSize:9.5,marginTop:2}}>Lot : {lotSel?.nom||"—"} · Au {fmtDate(form.dateTravauxAu)} · Échéance : {fmtDate(form.echeancePaiement)}</div>
            </div>
            {[{label:"FACTURATIONS",rows:[["Travaux TVA 20%",fC20*1.2,fP20*1.2,(fC20-fP20)*1.2],["Travaux TVA 10%",fC10*1.1,fP10*1.1,(fC10-fP10)*1.1],["Travaux TVA 5,5%",fC55*1.055,fP55*1.055,(fC55-fP55)*1.055],["TOTAL TTC",totTTCCumul,totTTCPrec,totTTCMois,true],["RESTANT À FACTURER",resteAFact,null,null,true,C.rouge]]},
              {label:"DÉDUCTIONS",rows:[[`RG (${(rgRate*100).toFixed(0)}%)`,rgCumul,rgPrec,rgMois],["Pénalités",pen,0,pen],["TOTAL DÉDUCTIONS",rgCumul+pen,rgPrec,rgMois+pen,true]]},
              {label:"PAIEMENTS",rows:[["Paiements précédents",paiPrec,0,paiPrec,true],["TOTAL À PAYER SITUATION",null,null,totalAPayer,true,C.rouge],["RESTANT À PAYER (dont RG)",resteAPayer,null,null,true,C.orange]]}
            ].map(section=>(
              <div key={section.label} style={{marginBottom:8}}>
                <div style={{background:C.gris,color:"#fff",padding:"4px 8px",fontWeight:700,fontSize:9}}>{section.label}</div>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                  <thead><tr style={{background:C.grisClair}}>
                    <th style={{padding:"3px 8px",textAlign:"left",fontSize:9}}></th>
                    {["Total cumulé","Cumul précédent","Mois considéré"].map(h=><th key={h} style={{padding:"3px 8px",textAlign:"right",fontSize:9}}>{h}</th>)}
                  </tr></thead>
                  <tbody>{section.rows.map(([label,cumul,prec,mois,bold,color],i)=>(
                    <tr key={i} style={{borderBottom:`1px solid ${C.grisbord}`,fontWeight:bold?700:400,background:bold?C.grisClair:"#fff"}}>
                      <td style={{padding:"4px 8px",color:color||C.gris}}>{label}</td>
                      {[cumul,prec,mois].map((v,j)=><td key={j} style={{padding:"4px 8px",textAlign:"right",color:color||C.gris}}>{v===null?"":typeof v==="string"?v:v?fmt(v):"—"}</td>)}
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            ))}
            <div style={{background:"#FFFDE7",border:"1px solid #F9A825",borderRadius:3,padding:"6px 10px",fontSize:8.5,color:"#5D4037",margin:"8px 0"}}>
              <strong>Note importante :</strong> La présente proposition ne peut valoir titre de paiement sans le visa du Maître de l'Ouvrage.
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:40,marginTop:18}}>
              {["Maître d'œuvre — ALMO",`Maître d'ouvrage — ${projetSel?.client||""}`].map((label,i)=>(
                <div key={i} style={{textAlign:"center"}}><p style={{fontWeight:700,fontSize:10,marginBottom:40}}>{label}</p><div style={{borderTop:`1px solid ${C.grisbord}`,paddingTop:5,fontSize:9,color:"#aaa"}}>Signature et cachet</div></div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};



// ── Clé API ────────────────────────────────────────────────────
const ApiKeySetup = ({ onKeySet }) => {
  const [key, setKey] = useState("");
  const [error, setError] = useState("");
  const [testing, setTesting] = useState(false);
  const tester = async () => {
    if (!key.startsWith("sk-ant-")) { setError("Clé invalide — doit commencer par sk-ant-"); return; }
    setTesting(true); setError("");
    try {
      const resp = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:10,messages:[{role:"user",content:"OK"}]})
      });
      if (resp.ok) { window.setApiKey(key); onKeySet(); }
      else { const d=await resp.json(); setError("Clé refusée : "+(d.error?.message||resp.status)); }
    } catch(e) { setError("Erreur : "+e.message); }
    setTesting(false);
  };
  return (
    <div style={{minHeight:"100vh",background:"#F4F3F1",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:12,padding:40,maxWidth:460,width:"100%",boxShadow:"0 4px 24px #00000015",border:"1px solid #D6D3CD"}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <img src={LOGO} alt="ALMO" style={{height:60,marginBottom:14,borderRadius:4}}/>
          <h1 style={{fontSize:21,fontWeight:800,color:"#3D3D3D",margin:"0 0 6px"}}>ALMO PROJECT</h1>
          <p style={{color:"#999",fontSize:13,margin:0}}>Entrez votre clé API Anthropic pour activer l'import automatique de PDF</p>
        </div>
        <div style={{marginBottom:14}}>
          <label style={{fontSize:11,fontWeight:700,color:"#3D3D3D",textTransform:"uppercase",letterSpacing:0.5,display:"block",marginBottom:6}}>Clé API Anthropic</label>
          <input type="password" value={key} onChange={e=>setKey(e.target.value)} placeholder="sk-ant-api03-..."
            onKeyDown={e=>e.key==="Enter"&&tester()}
            style={{width:"100%",border:"1.5px solid #D6D3CD",borderRadius:6,padding:"10px 14px",fontSize:13,fontFamily:"inherit",color:"#3D3D3D",boxSizing:"border-box"}}/>
        </div>
        {error&&<div style={{background:"#fee",border:"1px solid #fcc",borderRadius:6,padding:"8px 12px",fontSize:12,color:"#8B1A1A",marginBottom:12}}>⚠️ {error}</div>}
        <button onClick={tester} disabled={testing||!key}
          style={{width:"100%",background:"#8B1A1A",color:"#fff",border:"none",borderRadius:6,padding:"11px 0",fontWeight:700,fontSize:14,cursor:testing||!key?"not-allowed":"pointer",opacity:testing||!key?0.6:1,fontFamily:"inherit",marginBottom:12}}>
          {testing?"⏳ Vérification...":"Accéder à ALMO PROJECT →"}
        </button>
        <div style={{padding:"10px 14px",background:"#F4F3F1",borderRadius:6,fontSize:11,color:"#888",lineHeight:1.6}}>
          🔒 <strong style={{color:"#3D3D3D"}}>Sécurité</strong> — Clé stockée uniquement dans votre navigateur, jamais partagée.<br/>
          <a href="https://console.anthropic.com" target="_blank" style={{color:"#8B1A1A"}}>console.anthropic.com</a>
        </div>
      </div>
    </div>
  );
};

// ── Storage persistant ─────────────────────────────────────────
const STORAGE_KEY = "almo-project-v1";

// ── App principale ─────────────────────────────────────────────
function App() {
  const [page,setPage]=useState("dashboard");
  const [projets,setProjets]=useState([]);
  const [contexte,setContexte]=useState(null);
  const [storageReady,setStorageReady]=useState(false);
  const [apiKeyReady,setApiKeyReady]=useState(window.hasApiKey());

  // Charger depuis le stockage persistant
  useEffect(()=>{
    const load=async()=>{
      try {
        const result=await window.storage.get(STORAGE_KEY);
        if(result?.value){
          const data=JSON.parse(result.value);
          if(Array.isArray(data))setProjets(data);
        }
      } catch(e){console.log("Storage load:",e);}
      setStorageReady(true);
    };
    load();
  },[]);

  // Sauvegarder à chaque modification
  useEffect(()=>{
    if(!storageReady) return;
    const save=async()=>{
      try {await window.storage.set(STORAGE_KEY,JSON.stringify(projets));}
      catch(e){console.log("Storage save:",e);}
    };
    save();
  },[projets,storageReady]);

  const updateProjet=p=>setProjets(ps=>ps.find(x=>x.id===p.id)?ps.map(x=>x.id===p.id?p:x):[...ps,p]);
  const deleteProjet=id=>setProjets(ps=>ps.filter(p=>p.id!==id));

  return (
    <div style={{minHeight:"100vh",background:C.grisClair,fontFamily:"'DM Sans','Segoe UI',sans-serif",display:"flex",flexDirection:"column"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
        *{box-sizing:border-box;}
        input:focus,select:focus{outline:2px solid #8B1A1A55!important;border-color:#8B1A1A!important;}
        @media print{
          body>div>div:first-child{display:none!important;}
          body{background:white!important;}
          #acte-print,#paiement-print{padding:15px 25px!important;}
        }
      `}</style>
      {!apiKeyReady ? <ApiKeySetup onKeySet={()=>setApiKeyReady(true)}/> : <><Header page={page} setPage={setPage}/>
      {!storageReady?(
        <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"#999",fontSize:14}}>Chargement...</div>
      ):(
        <div style={{flex:1,overflowY:"auto"}}>
          {page==="dashboard"&&<Dashboard projets={projets} setPage={setPage}/>}
          {page==="projets"&&<PageProjets projets={projets} onUpdateProjet={updateProjet} onDeleteProjet={deleteProjet} setPage={setPage} setContexte={setContexte}/>}
          {page==="acte"&&<PageActe contexte={contexte} projets={projets}/>}
          {page==="paiement"&&<PagePaiement contexte={contexte} projets={projets}/>}
          {page==="client"&&<PortailClient projets={projets} onUpdateProjet={updateProjet}/>}
        </div>
      )}</>}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
